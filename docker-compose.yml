services:
  postgres:
    image: postgres:17-alpine
    container_name: repwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - repwise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d repwise']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  repwise_postgres_data:
